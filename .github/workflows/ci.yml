name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jobs_platform_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml, ctype, json, bcmath, zip, intl, gd
          coverage: none

      - name: Setup Composer
        run: |
          curl -sS https://getcomposer.org/installer | php
          sudo mv composer.phar /usr/local/bin/composer

      - name: Install PHP dependencies
        working-directory: ./backend
        run: |
          if [ ! -f composer.lock ]; then
            echo "ERROR: backend/composer.lock is missing. Run 'composer update' locally and commit the lock file."
            exit 1
          fi
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Copy .env
        working-directory: ./backend
        run: cp .env.example .env

      - name: Generate app key
        working-directory: ./backend
        run: php artisan key:generate

      - name: Configure test database
        working-directory: ./backend
        run: |
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=jobs_platform_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=root" >> .env
          echo "APP_ENV=testing" >> .env
          echo "APP_DEBUG=false" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "MAIL_MAILER=array" >> .env

      - name: Run migrations
        working-directory: ./backend
        run: php artisan migrate --force

      - name: Run Laravel tests
        working-directory: ./backend
        run: php artisan test

      - name: Validate composer dependencies
        working-directory: ./backend
        run: composer validate --strict

      - name: Check PHP syntax
        working-directory: ./backend
        run: find app -name "*.php" -exec php -l {} \;

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        run: npm run build

      - name: Copy build to Laravel public
        run: |
          rm -rf backend/public/app
          cp -r frontend/dist backend/public/app

      - name: Verify build output
        working-directory: ./backend/public/app
        run: |
          test -f index.html || (echo "index.html not found" && exit 1)
          test -d assets || (echo "assets directory not found" && exit 1)
          echo "Build output verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: backend/public/app/
          retention-days: 7
